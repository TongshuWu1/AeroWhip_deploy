# Crazyflie flight pipeline below the host (Mellinger, translation gains zeroed), identified on
# the 2026-10-27 drone-only calibration flights. Used by the native FlightController with the
# attitude gains of onboard.toml. Delivered thrust = thrust_scale*(1+voltage_slope*(V-V0))*T_cmd^p,
# T_cmd = firmware_mass*(a_sent + g).z_body in newtons as the firmware computes it.
firmware_mass_kg = 0.144        # ctrlMel.mass on cf_2
thrust_scale = 0.5529           # N^(1-p), fitted (drone-only flights, 3 held out)
thrust_exponent = 2.2           # fitted; the open-loop thrust map is not linear
voltage_slope_v_inv = 0.1765    # fitted; bench motor ramps: about 0.20 per volt
reference_voltage_v = 7.2       # battery voltage under load in flight
tilt_gain = 1.0                 # fitted 0.965; kept at 1 (not a modelled effect)
