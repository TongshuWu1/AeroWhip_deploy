# Onboard controller clock and command delay of the flight pipeline (native FlightController), and
# the attitude gains of its identified fallback law (crazyflie_flight.toml); the firmware law
# (crazyflie_firmware.toml) uses its own ctrlMel gains.
attitude_frequency_rad_s = [20.0, 20.0, 15.0]
attitude_damping_ratio = [1.0, 1.0, 1.0]
controller_period_s = 0.002   # 500 Hz: the firmware attitude rate (ATTITUDE_RATE)
command_delay_s = 0.005     # stage 2 with the firmware law: the port carries the response; 0.03 was the previous simulator value
