# Directed Stage 1: mechanics times smooth wall matching, no hit bonus.
# A virtual strike region, not a collision surface or a whip classifier.
[experiment]
name = "whip_stage1"
mode = "training"
device = "cuda"
batch_size = 256
updates = 100
seeds = [0]
evaluation_interval = 5
scene = "configs/scenes/default.toml"
model = "models/residual_20260921-000505.json"

[exploration]
smoothness_time_s = 1.0
amplitude_scale = 12.0

[cem]
elites = 26
alpha = 0.5
initial_std = 0.04
std_floor = 0.003
valid_elites_only = true

[trajectory]
command_rate_hz = 30.0
duration_s = 3.0
post_hold_s = 0.5
control_mapping = "cylinder_v1"
offset_lower_m = [-0.60, -0.60, -0.50]
offset_upper_m = [0.60, 0.60, 1.00]
max_speed_mps = 4.0
# No hard command-acceleration limit; the return scale below is not a limit.
control_count = 32

[workspace]
radius_m = 0.60
height_lower_world_m = 1.50
height_upper_world_m = 3.00

[return]
acceleration_cost_weight = 0.005
acceleration_cost_scale_mps2 = 15.0
failure_return = -1.0
drone_lower_world_m = [-2.0, -2.0, 1.0]
drone_upper_world_m = [2.0, 2.0, 3.0]
maximum_tilt_deg = 60.0
minimum_cable_height_m = 0.05

[request]
heading_rad = 0.0
elevation_rad = 0.0
release_height_world_m = 2.0
tip_speed_mps = 3.0

[strike_surface]
distance_m = 1.1
width_m = 1.0
height_m = 0.6
maximum_entry_angle_deg = 30.0
approach_width_m = 0.35

[matching]
# Height width is retained for legacy configuration compatibility; the
# directed objective instead measures distance to the finite wall region.
height_width_m = 0.35
speed_width_mps = 1.5
direction_width_deg = 30.0
time_preference = 0.05
speed_mode = "minimum"

[mechanics]
smoothing_sigma_fraction = 0.05
windows_s = [0.2, 0.4, 0.6, 0.8]
window_stride_s = 0.05
tip_lag_s = 0.15
event_start_s = 0.03
event_end_s = 3.03
turn_reference_rad = 0.5
travel_reference_fraction = 0.2
spread_scale_fraction = 0.25
nonrigid_reference_mps = 0.5
release_reference_mps = 0.5
forward_reference_mps = 1.0
rigid_pinv_rtol = 1e-8
