[build-system]
requires = ["setuptools>=69", "pybind11==3.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aerowhip"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6",
    "scipy>=1.13",
    "pyvista>=0.44",
    "pyvistaqt>=0.13.1",
    "PySide6>=6.11.2",
    "torch==2.11.0",
    "triton-windows==3.6.0.post26; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = ["pybind11==3.0.1"]
review = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aerowhip*"]

[tool.setuptools.package-data]
"aerowhip.viewer" = ["assets/drone/*.stl"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
